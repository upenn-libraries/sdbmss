---
- name: "Set up Docker and Docker Swarm"
  hosts: all
  become: true
  gather_facts: true
  roles:
    - docker-swarm

- name: "Deploy application"
  hosts: docker_swarm_managers
  become: true
  gather_facts: true
  pre_tasks:
    - name: Resolve Vault secrets once, before the roles downgrade requests
      ansible.builtin.set_fact:
        "{{ item }}": "{{ lookup('ansible.builtin.vars', item) }}"
      loop: "{{ hostvars[inventory_hostname] | select('match', '.+_vault_values$') }}"
  tasks:
    - name: Link project source
      ansible.builtin.import_role:
        name: app
        tasks_from: symlink_project
      tags: app
    - name: Deploy Traefik
      ansible.builtin.import_role:
        name: traefik
      tags: traefik
    - name: Deploy Mysql
      ansible.builtin.import_role:
        name: mysql
      tags: mysql
    - name: Deploy RabbitMQ
      ansible.builtin.import_role:
        name: rabbitmq
      tags: rabbitmq
    - name: Deploy Jena
      ansible.builtin.import_role:
        name: jena
      tags: jena
    - name: Deploy Interface
      ansible.builtin.import_role:
        name: interface
      tags: interface
    - name: Deploy Application
      ansible.builtin.import_role:
        name: app
      tags: app
    - name: Deploy Solr
      ansible.builtin.import_role:
        name: solr
      tags: solr
    - name: Deploy Chrome for testing
      ansible.builtin.import_role:
        name: chrome
      tags: chrome
      when: is_development | default (false, true)
    - name: Deploy Delayed Job
      ansible.builtin.import_role:
        name: delayed_job
      tags: delayed_job
  post_tasks:
    - name: "Create cron jobs"
      ansible.builtin.cron:
        name: "{{ item.name }}"
        minute: "{{ item.minute }}"
        hour: "{{ item.hour }}"
        day: "{{ item.day }}"
        weekday: "{{ item.weekday }}"
        job: "{{ item.job }}"
      loop: "{{ cronjobs }}"
    - name: Prune images that are older than 2+ hours
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: false
          until: 2h
      when: not is_development | default(false, true)
