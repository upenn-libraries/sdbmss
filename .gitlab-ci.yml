---
variables:
  FF_SCRIPT_SECTIONS: "true"
  GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PIPELINE_ID}/${CI_PROJECT_NAME}"

include:
  - component: $CI_SERVER_FQDN/devops/gitlab/components/sast/secret_scan@~latest
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_context: "rails_app/"
      docker_target: "base"
      job_suffix: "_base"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      needs_build:
        - secret_detection
      platforms: '["linux/amd64"]'
      stage: "build_base"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_args: "--build-arg RAILS_ENV=development"
      docker_build_context: "rails_app/"
      docker_target: "development"
      job_suffix: "_development"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      needs_build:
        - amend_manifest_base
      platforms: '["linux/amd64"]'
      stage: "build_development"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      amend_tag_with_docker_target: "false"
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_args: "--build-arg RAILS_ENV=production"
      docker_build_context: "rails_app/"
      docker_target: "production"
      job_suffix: "_production"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      needs_build:
        - amend_manifest_development
      platforms: '["linux/amd64"]'
      stage: "build_production"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/sast/trivy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_tag_to_scan: "${CI_COMMIT_SHA}"
      needs:
        - "amend_manifest_production"
      stage: "test"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_finalize@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      needs_copy:
        - trivy_scan
  - component: $CI_SERVER_FQDN/devops/gitlab/components/deploy/deploy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      deploy_environment: "staging"
      deploy_environment_url: "https://sdbmss-staging.library.upenn.edu"
      deploy_host: ${DEPLOY_HOST}
      job_suffix: "staging"
      valid_principals: ${VALID_PRINCIPALS}
      vault_auth_role: ${VAULT_AUTH_ROLE}
      vault_ssh_client_role: ${VAULT_SSH_CLIENT_ROLE}
  - component: $CI_SERVER_FQDN/devops/gitlab/components/deploy/deploy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      deploy_environment: "production"
      deploy_environment_url: "https://sdbm.library.upenn.edu"
      deploy_host: ${DEPLOY_HOST}
      image_tag: ${CI_COMMIT_TAG}
      job_suffix: "production"
      valid_principals: ${VALID_PRINCIPALS}
      vault_auth_role: ${VAULT_AUTH_ROLE}
      vault_ssh_client_role: ${VAULT_SSH_CLIENT_ROLE}

stages:
  - secret_check
  - build_base
  - build_development
  - build_production
  - test
  - finalize
  - deploy

deploy_staging:
  needs:
    - copy_docker_images
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_production:
  needs:
    - copy_docker_images
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.[a-zA-Z0-9]+)?$/
